# ตรวจโค้ดอัตโนมัติทุกครั้งที่ push: ชนิดข้อมูล (TypeScript) + รูปแบบโค้ด (ESLint) + เทสกฎคิดเงิน / ช่วงเปิดจอง (bun test)
# ไม่ผ่าน = ขึ้นกากบาทแดงที่ commit ใน GitHub (เว็บจริงบน Vercel deploy แยกกัน)
name: ตรวจโค้ด

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: สร้างชนิดข้อมูลของหน้าเว็บ (Next.js)
        run: bunx next typegen
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint
        run: bunx eslint src scripts
      - name: เทส
        run: bun test
