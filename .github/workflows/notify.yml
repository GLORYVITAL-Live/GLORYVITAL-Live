# เตือนก่อนไลฟ์: เรียกเว็บทุก 15 นาที
# ต้องตั้ง Secret ชื่อ CRON_SECRET (ค่าเดียวกับใน Variables ของ Railway) ที่ GitHub > Settings > Secrets and variables > Actions
# ที่อยู่เว็บ: Variable ชื่อ SITE_URL (ไม่ตั้ง = ที่อยู่บน Railway ด้านล่าง)
# GitHub อาจเริ่มช้ากว่าเวลาที่ตั้ง 5–15 นาทีตอนคนใช้เยอะ · กดรันเองได้ที่แท็บ Actions > เตือนก่อนไลฟ์ > Run workflow
name: เตือนก่อนไลฟ์

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: เรียก /api/cron/notify
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://glory-vital-live.up.railway.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "ยังไม่ได้ตั้ง Secret CRON_SECRET"; exit 1; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/cron/notify"
