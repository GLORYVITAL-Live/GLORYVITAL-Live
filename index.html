<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7FA">
  <title>จองคิวไลฟ์ | GLORY VITAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // ใช้ธีมที่ผู้ใช้เลือกไว้ทันที ก่อนหน้าเว็บแสดงผล (กันจอกระพริบ)
    try {
      var t = localStorage.getItem('glory_booking_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    :root {
      /* โทนแบรนด์ Glory Vital (#DE4481 จาก gloryofficialth.com) */
      --bg: #FFF7FA;
      --surface: #FFFFFF;
      --ink: #3A1628;
      --muted: #8C6879;
      --line: #F2DCE6;
      --accent: #DE4481;      /* ชมพูแบรนด์ ใช้กับจุดตกแต่ง */
      --brand: #C62F6A;       /* ชมพูเข้ม ใช้กับปุ่ม/ตัวหนังสือ (อ่านง่ายกว่าบนพื้นขาว) */
      --brand-ink: #FFFFFF;
      --brand-soft: #FDE8F0;
      --warn-bg: #FFF2E8;
      --warn-line: #F6BE93;
      --warn-ink: #8A4413;
      --info-bg: #FDE8F0;
      --info-ink: #9C2356;
      --ok: #1C7A4E;
      --err: #C0352B;
      --p0: #DE4481;
      --p1: #E8894F;
      --p2: #9A5BD8;
      --p3: #2E9C94;
      --shadow: 0 1px 2px rgba(122, 31, 71, .05), 0 4px 14px rgba(122, 31, 71, .06);
      --toolbar-h: 132px;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1A1016;
        --surface: #26171F;
        --ink: #FBEAF1;
        --muted: #C79FB2;
        --line: #3D2632;
        --accent: #F2699F;
        --brand: #F2699F;
        --brand-ink: #2B0A18;
        --brand-soft: #46192E;
        --warn-bg: #2E1D12;
        --warn-line: #6E4323;
        --warn-ink: #F6C49C;
        --info-bg: #3A1627;
        --info-ink: #F8B6CF;
        --ok: #5BCF93;
        --err: #FF8479;
        --p0: #F2699F;
        --p1: #F3A574;
        --p2: #C39BF2;
        --p3: #5CC9C0;
        --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1A1016;
      --surface: #26171F;
      --ink: #FBEAF1;
      --muted: #C79FB2;
      --line: #3D2632;
      --accent: #F2699F;
      --brand: #F2699F;
      --brand-ink: #2B0A18;
      --brand-soft: #46192E;
      --warn-bg: #2E1D12;
      --warn-line: #6E4323;
      --warn-ink: #F6C49C;
      --info-bg: #3A1627;
      --info-ink: #F8B6CF;
      --ok: #5BCF93;
      --err: #FF8479;
      --p0: #F2699F;
      --p1: #F3A574;
      --p2: #C39BF2;
      --p3: #5CC9C0;
      --shadow: none;
      color-scheme: dark;
    }
    :root[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans Thai', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body.has-bar { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    button { font: inherit; color: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .page { max-width: 760px; margin: 0 auto; padding: 0 16px; }

    /* ---------- ส่วนหัว ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 0 8px;
    }
    .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
    .wordmark { font-weight: 700; font-size: 17px; letter-spacing: .14em; color: var(--ink); }
    .wordmark .star { color: var(--accent); letter-spacing: 0; margin: 0 .04em; }
    .brand-sub { font-size: 13px; font-weight: 500; color: var(--muted); }

    .top-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .theme-btn {
      width: 38px; height: 38px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 50%; cursor: pointer;
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--brand); }
    .theme-btn svg { width: 18px; height: 18px; }
    .theme-btn .i-sun { display: none; }
    .is-dark .theme-btn .i-sun { display: block; }
    .is-dark .theme-btn .i-moon { display: none; }
    body { transition: background-color .25s, color .25s; }

    .user-chip {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 999px;
      padding: 4px 6px 4px 4px;
      min-width: 0;
    }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--brand-soft); color: var(--brand);
      display: grid; place-items: center;
      font-weight: 600; font-size: 14px; flex-shrink: 0;
    }
    .user-text { min-width: 0; line-height: 1.2; }
    .user-name, .user-email { display: block; }
    .user-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .signout {
      border: none; background: none; cursor: pointer;
      font-size: 12px; color: var(--muted);
      padding: 6px 8px; border-radius: 999px; white-space: nowrap;
    }
    .signout:hover { background: var(--bg); color: var(--ink); }
    .signout { display: inline-flex; align-items: center; gap: 4px; }
    .signout svg { width: 16px; height: 16px; display: none; }
    @media (max-width: 479px) {
      .signout svg { display: block; }
      .signout .lbl { display: none; }
      .wordmark { font-size: 15px; letter-spacing: .1em; }
    }

    @media (max-width: 479px) {
      .user-email, .brand-sub { display: none; }
      .user-chip { min-width: 0; }
    }
    .hero { padding: 22px 0 16px; }
    .hero h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; font-weight: 700; color: var(--ink); }
    .hero h1::after {
      content: ''; display: block; width: 36px; height: 3px; border-radius: 3px;
      background: var(--accent); margin-top: 10px;
    }
    .hero p { margin: 0; color: var(--muted); max-width: 52ch; }

    /* ---------- เข้าสู่ระบบ ---------- */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      transition: box-shadow .3s;
    }
    .login-card.is-flash { box-shadow: 0 0 0 3px var(--brand); }
    .login-card strong { display: block; font-size: 15px; }
    .login-card span { color: var(--muted); font-size: 13px; }
    #gsiButton { min-height: 40px; }

    /* ---------- ประกาศ ---------- */
    .notice { border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; display: flex; gap: 10px; }
    .notice-lock { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); font-weight: 500; }
    .notice-info { background: var(--info-bg); color: var(--info-ink); }

    /* ---------- แถบวันที่ (ติดด้านบน) ---------- */
    .toolbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg);
      padding: 10px 0 10px;
      border-bottom: 1px solid var(--line);
      margin: 0 -16px;
      padding-left: 16px; padding-right: 16px;
    }
    .date-strip {
      display: flex; gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 2px 4px;
      scroll-snap-type: x proximity;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    /* ลากด้วยเมาส์ได้ + ขอบจางบอกว่ายังมีวันที่ต่อ */
    @media (pointer: fine) { .date-strip { cursor: grab; } }
    .date-strip.is-dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
    .date-strip.is-dragging .chip { pointer-events: none; }
    .date-strip.fade-r {
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent);
      mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent);
    }
    .date-strip.fade-l {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 36px);
      mask-image: linear-gradient(to right, transparent, #000 36px);
    }
    .date-strip.fade-l.fade-r {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent);
      mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent);
    }
    .chip {
      position: relative;
      flex: 0 0 auto;
      min-width: 58px;
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 8px 7px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      scroll-snap-align: start;
      line-height: 1.15;
    }
    .chip-wd { font-size: 12px; color: var(--muted); }
    .chip-day { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chip-mon { font-size: 11px; color: var(--muted); }
    .chip-count { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .chip:hover { border-color: var(--accent); }
    .chip.is-active { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); box-shadow: 0 4px 12px rgba(198, 47, 106, .28); }
    .chip.is-active .chip-wd, .chip.is-active .chip-mon, .chip.is-active .chip-count { color: var(--brand-ink); opacity: .85; }
    .chip.is-active.has-sel::after { background: var(--brand-ink); }
    .chip.has-sel::after {
      content: ''; position: absolute; top: 6px; right: 6px;
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    }

    .filters { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .filter.is-multi[aria-pressed="true"]::after {
      content: '✓'; font-size: 11px; font-weight: 700; margin-left: -1px;
    }
    .filter[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }

    /* ---------- สลับมุมมอง การ์ด / ตาราง ---------- */
    .toolbar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .toolbar-row .filters { margin-top: 0; flex: 1; min-width: 0; }
    .view-toggle {
      display: inline-flex; margin-left: auto; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 999px; padding: 2px;
    }
    .view-btn {
      border: none; background: transparent; cursor: pointer;
      border-radius: 999px; padding: 4px 11px;
      font-size: 13px; color: var(--muted);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .view-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .view-btn:hover { color: var(--ink); }
    @media (max-width: 479px) {
      .view-btn .lbl { display: none; }
      .view-btn { padding: 5px 9px; }
    }
    .view-btn[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 600; }

    /* ---------- รายการ slot ---------- */
    .day { padding-top: 18px; scroll-margin-top: calc(var(--toolbar-h) + 4px); }
    .day-title {
      font-size: 16px; font-weight: 600; margin: 0 0 10px;
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .rel {
      font-size: 12px; font-weight: 600;
      color: var(--brand); background: var(--brand-soft);
      padding: 1px 8px; border-radius: 999px;
    }
    .day-count { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: auto; }

    .slot-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 560px) { .slot-grid { grid-template-columns: 1fr 1fr; } }

    .slot {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 12px 14px 12px 16px;
      min-height: 66px;
      cursor: pointer;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    .slot:hover { border-color: var(--accent); }
    .slot-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .slot-time { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .slot-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .tag { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; }
    .tag::before, .filter.p0::before, .filter.p1::before, .filter.p2::before, .filter.p3::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--pc);
    }
    .p0 { --pc: var(--p0); } .p1 { --pc: var(--p1); } .p2 { --pc: var(--p2); } .p3 { --pc: var(--p3); }

    .check {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid var(--line);
      display: grid; place-items: center; flex-shrink: 0;
      color: transparent;
      transition: background .15s, border-color .15s;
    }
    .check svg { width: 14px; height: 14px; }
    .slot.is-selected { background: var(--brand-soft); border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
    .slot.is-selected .check { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
    .slot.is-blocked { opacity: .42; }
    .slot.is-blocked:hover { border-color: var(--line); }

    /* มุมมองตาราง: ใช้ปุ่ม slot ชุดเดิม แค่จัดวางเป็นแถว */
    .table-head { display: none; }
    body.view-table .slot-grid {
      grid-template-columns: 1fr; gap: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    body.view-table .table-head,
    body.view-table .slot {
      display: grid;
      grid-template-columns: 24px minmax(116px, 1fr) minmax(0, 1.2fr) 52px;
      gap: 12px; align-items: center;
    }
    body.view-table .table-head {
      padding: 8px 14px;
      background: var(--brand-soft);
      color: var(--info-ink);
      font-size: 12px; font-weight: 600;
    }
    .table-head span:last-child { text-align: right; }
    body.view-table .slot {
      border: none; border-top: 1px solid var(--line);
      border-radius: 0; box-shadow: none;
      min-height: 50px; padding: 8px 14px;
    }
    body.view-table .slot-text,
    body.view-table .slot-meta { display: contents; }
    body.view-table .check { order: -1; width: 22px; height: 22px; }
    body.view-table .check svg { width: 12px; height: 12px; }
    body.view-table .slot-time { font-size: 15px; }
    body.view-table .slot-meta .tag { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.view-table .slot-meta > span:last-child { text-align: right; color: var(--muted); font-size: 13px; }
    body.view-table .slot:hover { background: var(--bg); border-color: var(--line); }
    body.view-table .slot.is-selected,
    body.view-table .slot.is-selected:hover { background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); }

    /* ---------- สถานะ ---------- */
    .state { text-align: center; padding: 48px 16px; color: var(--muted); }
    .state strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
    .retry-btn {
      margin-top: 12px; border: 1px solid var(--brand); color: var(--brand); background: var(--surface);
      border-radius: 999px; padding: 8px 18px; cursor: pointer;
    }
    .skeleton { padding-top: 18px; }
    .sk-line { height: 18px; width: 40%; border-radius: 6px; background: var(--line); margin-bottom: 12px; }
    .sk-card { height: 66px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 8px; }

    /* ---------- แถบล่าง ---------- */
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: var(--surface);
      border-top: 1px solid var(--line);
      box-shadow: 0 -6px 24px rgba(122, 31, 71, .10);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      transform: translateY(110%);
      transition: transform .22s ease-out;
    }
    .bar.is-open { transform: translateY(0); }
    .bar-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .bar-info { flex: 1; min-width: 0; line-height: 1.25; }
    .bar-count { font-weight: 600; }
    .bar-hours { font-size: 13px; color: var(--muted); }
    .btn {
      border: none; border-radius: 999px; cursor: pointer;
      padding: 12px 20px; font-weight: 600; white-space: nowrap;
    }
    .btn-primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 4px 12px rgba(198, 47, 106, .25); }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:disabled { opacity: .6; cursor: wait; }
    .btn-ghost { background: transparent; color: var(--muted); padding: 12px 12px; }
    .btn-ghost:hover { color: var(--ink); }

    /* ---------- หน้าต่างยืนยัน ---------- */
    dialog {
      border: none; padding: 0;
      background: var(--surface); color: var(--ink);
      width: min(520px, 100%);
      max-height: 85vh;
      border-radius: 24px;
    }
    dialog::backdrop { background: rgba(58, 22, 40, .45); }
    @media (max-width: 559px) {
      dialog { margin: auto 0 0; max-width: 100%; border-radius: 24px 24px 0 0; }
    }
    .sheet { display: flex; flex-direction: column; max-height: 85vh; }
    .sheet-head { padding: 20px 20px 8px; }
    .sheet-head h2 { margin: 0 0 4px; font-size: 20px; }
    .sheet-head p { margin: 0; color: var(--muted); font-size: 14px; }
    .sheet-list { list-style: none; margin: 0; padding: 8px 20px; overflow-y: auto; }
    .sheet-list li {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .sheet-list li:last-child { border-bottom: none; }
    .sum-main { font-weight: 600; font-variant-numeric: tabular-nums; }
    .sum-sub { font-size: 13px; color: var(--muted); }
    .sum-status { font-size: 13px; text-align: right; flex-shrink: 0; max-width: 50%; }
    .sum-status.ok { color: var(--ok); font-weight: 600; }
    .sum-status.err { color: var(--err); }
    .sheet-actions {
      display: flex; gap: 8px; justify-content: flex-end;
      padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
    }
    .sheet-actions .btn-primary { flex: 1; }
    @media (min-width: 560px) { .sheet-actions .btn-primary { flex: 0 0 auto; } }

    /* ---------- toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 50;
      transform: translate(-50%, 20px);
      opacity: 0; pointer-events: none;
      background: var(--ink); color: var(--bg);
      padding: 11px 18px; border-radius: 12px;
      font-size: 14px; max-width: calc(100% - 32px); width: max-content; text-align: center;
      transition: opacity .2s, transform .2s;
    }
    .toast.is-show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--err); color: #fff; }
    body.has-bar .toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

    /* ---------- ปุ่มกลับขึ้นบนสุด ---------- */
    .to-top {
      position: fixed; z-index: 25;
      right: max(16px, calc((100vw - 760px) / 2 - 64px));
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer;
      background: var(--brand); color: var(--brand-ink);
      border: none;
      box-shadow: 0 6px 18px rgba(198, 47, 106, .32);
      opacity: 0; visibility: hidden; transform: translateY(10px);
      transition: opacity .25s, transform .25s, visibility .25s, bottom .22s ease-out;
    }
    .to-top.is-show { opacity: 1; visibility: visible; transform: translateY(0); }
    .to-top:hover { filter: brightness(1.08); }
    .to-top svg { width: 20px; height: 20px; }
    body.has-bar .to-top { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="wordmark" aria-label="GLORY VITAL">GL<span class="star">✦</span>RY VITAL</span><span class="brand-sub">Live booking</span></div>
      <div class="top-actions">
      <button type="button" class="theme-btn" id="themeBtn">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
      <div class="user-chip" id="userChip" hidden>
        <span class="avatar" id="userAvatar" aria-hidden="true"></span>
        <span class="user-text">
          <span class="user-name" id="userName"></span>
          <span class="user-email" id="userEmail"></span>
        </span>
        <button type="button" class="signout" id="signOutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg><span class="lbl">ออกจากระบบ</span></button>
      </div>
      </div>
    </header>

    <section class="hero">
      <h1>จองคิวไลฟ์</h1>
      <p>แตะเลือก slot ที่ต้องการ แล้วกดจองที่แถบด้านล่าง ระบบจะลงปฏิทินให้อัตโนมัติ</p>
    </section>

    <div class="login-card" id="loginCard" hidden>
      <div>
        <strong id="loginTitle">เข้าสู่ระบบก่อนจอง</strong>
        <span id="loginHint">ใช้อีเมลที่ลงทะเบียนไว้กับทีมงาน</span>
      </div>
      <div id="gsiButton"></div>
    </div>

    <div class="notice notice-lock" id="lockBanner" role="status" hidden></div>
    <div class="notice notice-info" id="infoBanner" hidden></div>

    <div class="toolbar" id="toolbar" hidden>
      <nav class="date-strip" id="dateStrip" aria-label="เลือกวันที่"></nav>
      <div class="toolbar-row">
        <div class="filters" id="filters" role="group" aria-label="กรองตามแพลตฟอร์ม" hidden></div>
        <div class="view-toggle" role="group" aria-label="รูปแบบการแสดงผล">
          <button type="button" class="view-btn" data-view="card" aria-pressed="true" aria-label="แสดงแบบการ์ด">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>
            <span class="lbl">การ์ด</span>
          </button>
          <button type="button" class="view-btn" data-view="table" aria-pressed="false" aria-label="แสดงแบบตาราง">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
            <span class="lbl">ตาราง</span>
          </button>
        </div>
      </div>
    </div>

    <main id="dayList"></main>
    <div class="state" id="filterEmpty" hidden>
      <strong>ไม่มี slot ว่างของแพลตฟอร์มที่เลือก</strong>
      ลองเลือก "ทั้งหมด" เพื่อดู slot อื่น
    </div>
  </div>

  <div class="bar" id="bar" aria-hidden="true" inert>
    <div class="bar-inner">
      <div class="bar-info">
        <div class="bar-count" id="barCount"></div>
        <div class="bar-hours" id="barHours"></div>
      </div>
      <button type="button" class="btn btn-ghost" id="barClear">ล้าง</button>
      <button type="button" class="btn btn-primary" id="barAction"></button>
    </div>
  </div>

  <dialog id="dlg" aria-labelledby="dlgTitle">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="dlgTitle"></h2>
        <p id="dlgNote"></p>
      </div>
      <ul class="sheet-list" id="dlgList"></ul>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="dlgCancel">ยกเลิก</button>
        <button type="button" class="btn btn-primary" id="dlgConfirm">ยืนยันการจอง</button>
        <button type="button" class="btn btn-primary" id="dlgDone" hidden>เสร็จสิ้น</button>
      </div>
    </div>
  </dialog>

  <button type="button" class="to-top" id="toTop" aria-label="กลับขึ้นบนสุด" title="กลับขึ้นบนสุด">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ★★★ ตั้งค่าตรงนี้ ★★★
    // URL ของ Apps Script web app (ลงท้ายด้วย /exec) จาก Deploy > Manage deployments
    const API_URL = 'https://script.google.com/macros/s/AKfycbzKZN_rbSgtpsSfHJMg07frKFIVzBr11U1Y6pazSpOdX-oyyAvEmfr4YGApop_xemyq/exec';
    const GOOGLE_CLIENT_ID = '1061582080754-eblmgn19o2cvds5sg22d7p70me7qitbs.apps.googleusercontent.com';

    // ให้ตรงกับค่าใน Apps Script (ฝั่ง server เช็คซ้ำอีกชั้นเสมอ)
    const MAX_SLOTS_PER_DAY = 2;
    const MAX_HOURS_PER_DAY = 4;
    const MAX_PER_REQUEST = 10;

    const TOKEN_KEY = 'glory_booking_id_token';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let idToken = null;
    let currentUser = null;
    let isLocked = false;
    const activeFilters = new Set(); // ว่าง = แสดงทุกแพลตฟอร์ม
    let platformIndex = {};
    let dayObserver = null;
    let toastTimer = null;
    const slotByRow = new Map();
    const cardByRow = new Map();
    const selected = new Map();

    const $ = id => document.getElementById(id);
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    // ---------- วันที่ภาษาไทย (ปี ค.ศ. ให้ตรงกับชีต) ----------
    const fmtDayLong = new Intl.DateTimeFormat('th-TH-u-ca-gregory', { weekday: 'long', day: 'numeric', month: 'long' });
    const fmtDayShort = new Intl.DateTimeFormat('th-TH-u-ca-gregory', { weekday: 'short', day: 'numeric', month: 'short' });
    const fmtWeekShort = new Intl.DateTimeFormat('th-TH-u-ca-gregory', { weekday: 'short' });
    const fmtMonthShort = new Intl.DateTimeFormat('th-TH-u-ca-gregory', { month: 'short' });

    function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
    function keyOf(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function relLabel(k) {
      const t = new Date(); t.setHours(0, 0, 0, 0);
      if (k === keyOf(t)) return 'วันนี้';
      t.setDate(t.getDate() + 1);
      if (k === keyOf(t)) return 'พรุ่งนี้';
      return '';
    }
    function hoursOf(s) {
      let h = (s.endMs - s.startMs) / 3600000;
      if (h <= 0) h += 24; // slot ข้ามเที่ยงคืน
      return h;
    }
    function fmtHours(h) { return (Number.isInteger(h) ? h : h.toFixed(1)) + ' ชม.'; }
    function platformOf(s) { return s.platform || 'Live'; }

    // ---------- เรียก API ----------
    // ส่งแบบ text/plain เพื่อไม่ให้ browser ส่ง preflight (Apps Script ไม่รองรับ OPTIONS)
    async function callApi(action, payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, payload || {})),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error('ระบบตอบกลับผิดรูปแบบ (Google อาจขัดข้องชั่วคราว)');
      }
    }

    // ใช้กับคำสั่งที่อ่านข้อมูลอย่างเดียว (init, login) ลองซ้ำได้โดยไม่มีผลข้างเคียง
    async function callApiWithRetry(action, payload) {
      const delays = [1000, 2500];
      let lastErr;
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const res = await callApi(action, payload);
          if (res.ok || res.authError) return res;
          lastErr = new Error(res.message || 'ไม่ทราบสาเหตุ');
        } catch (err) {
          lastErr = err;
        }
        if (attempt < delays.length) await new Promise(r => setTimeout(r, delays[attempt]));
      }
      throw lastErr;
    }

    // ---------- Token ----------
    function tokenExpMs(token) {
      try {
        let p = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        while (p.length % 4) p += '=';
        return JSON.parse(atob(p)).exp * 1000;
      } catch (e) {
        return 0;
      }
    }
    function tokenIsFresh(token) { return !!token && tokenExpMs(token) - Date.now() > 60 * 1000; }
    function saveToken(t) { try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
    function loadToken() { try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
    function clearToken() { try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }

    // ---------- เข้าสู่ระบบ ----------
    function setAuthUi(state) {
      $('loginCard').hidden = state === 'in';
      $('gsiButton').hidden = state !== 'out';
      $('loginTitle').textContent = state === 'checking' ? 'กำลังตรวจสอบบัญชี...' : 'เข้าสู่ระบบก่อนจอง';
      $('loginHint').hidden = state === 'checking';
      $('userChip').hidden = state !== 'in';
      if (state === 'in' && currentUser) {
        const initial = (currentUser.mcName.match(/[ก-ฮA-Za-z0-9]/) || ['M'])[0];
        $('userAvatar').textContent = initial;
        $('userName').textContent = 'Mc ' + currentUser.mcName;
        $('userEmail').textContent = currentUser.email;
      }
      updateBar();
    }

    async function signIn(credential, silent) {
      setAuthUi('checking');
      try {
        const res = await callApiWithRetry('login', { idToken: credential });
        if (res.ok) {
          idToken = credential;
          currentUser = { mcName: res.mcName, email: res.email };
          saveToken(credential);
          setAuthUi('in');
          if (!silent) showToast(`ยินดีต้อนรับ Mc ${res.mcName}`);
        } else {
          signOut();
          showToast(res.message, 'error');
        }
      } catch (err) {
        signOut();
        showToast('เชื่อมต่อระบบไม่สำเร็จ: ' + err.message, 'error');
      }
    }

    function signOut() {
      idToken = null;
      currentUser = null;
      clearToken();
      if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      setAuthUi('out');
    }

    // เรียกเมื่อสคริปต์ Google Sign-In โหลดเสร็จ
    function initGsi() {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: response => signIn(response.credential, false),
        auto_select: true,
      });
      google.accounts.id.renderButton($('gsiButton'), {
        theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'th',
      });
      if (!currentUser && !loadToken()) google.accounts.id.prompt();
    }

    function goToLogin() {
      window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
      const card = $('loginCard');
      card.classList.add('is-flash');
      setTimeout(() => card.classList.remove('is-flash'), 1400);
    }

    $('signOutBtn').addEventListener('click', () => {
      signOut();
      showToast('ออกจากระบบแล้ว');
    });

    // ---------- โหลดข้อมูล ----------
    function showSkeleton() {
      const list = $('dayList');
      list.innerHTML = '';
      const sk = el('div', 'skeleton');
      sk.setAttribute('aria-label', 'กำลังโหลด slot ที่ว่าง');
      sk.appendChild(el('div', 'sk-line'));
      for (let i = 0; i < 4; i++) sk.appendChild(el('div', 'sk-card'));
      list.appendChild(sk);
      $('filterEmpty').hidden = true;
    }

    function showState(title, detail, withRetry) {
      const list = $('dayList');
      list.innerHTML = '';
      const box = el('div', 'state');
      box.appendChild(el('strong', '', title));
      box.appendChild(document.createTextNode(detail));
      if (withRetry) {
        box.appendChild(document.createElement('br'));
        const b = el('button', 'retry-btn', 'ลองอีกครั้ง');
        b.type = 'button';
        b.onclick = loadAll;
        box.appendChild(b);
      }
      list.appendChild(box);
      $('toolbar').hidden = true;
      $('filterEmpty').hidden = true;
    }

    async function loadAll() {
      showSkeleton();
      try {
        const res = await callApiWithRetry('init');
        applyNotices(res.siteNotice, res.scheduleNotice);
        renderSlots(res.slots || []);
      } catch (err) {
        showState('โหลด slot ไม่สำเร็จ', err.message, true);
      }
    }

    function applyNotices(siteNotice, scheduleNotice) {
      isLocked = !!siteNotice;
      $('lockBanner').textContent = siteNotice ? '⚠️ ' + siteNotice : '';
      $('lockBanner').hidden = !siteNotice;
      $('infoBanner').textContent = scheduleNotice || '';
      $('infoBanner').hidden = !scheduleNotice;
      if (isLocked) selected.clear();
    }

    // ---------- แสดง slot ----------
    function renderSlots(slots) {
      slotByRow.clear();
      cardByRow.clear();
      slots.forEach(s => slotByRow.set(s.row, s));
      for (const row of Array.from(selected.keys())) if (!slotByRow.has(row)) selected.delete(row);

      platformIndex = {};
      slots.forEach(s => {
        const p = platformOf(s);
        if (!(p in platformIndex)) platformIndex[p] = Object.keys(platformIndex).length % 4;
      });
      for (const f of Array.from(activeFilters)) if (!(f in platformIndex)) activeFilters.delete(f);

      const list = $('dayList');
      list.innerHTML = '';

      if (!slots.length) {
        showState('ยังไม่มี slot ว่างให้จอง', 'แวะกลับมาดูใหม่เมื่อทีมงานอัปเดตตาราง', false);
        updateBar();
        return;
      }
      $('toolbar').hidden = false;

      const groups = new Map();
      slots.forEach(s => {
        if (!groups.has(s.date)) groups.set(s.date, []);
        groups.get(s.date).push(s);
      });
      const keys = Array.from(groups.keys()).sort();

      keys.forEach(k => {
        const sec = el('section', 'day');
        sec.id = 'day-' + k;
        sec.dataset.date = k;
        const h = el('h2', 'day-title', fmtDayLong.format(parseKey(k)));
        const rel = relLabel(k);
        if (rel) h.appendChild(el('span', 'rel', rel));
        h.appendChild(el('span', 'day-count'));
        sec.appendChild(h);
        const grid = el('div', 'slot-grid');
        const head = el('div', 'table-head');
        head.setAttribute('aria-hidden', 'true');
        ['', 'เวลา', 'แพลตฟอร์ม', 'ชม.'].forEach(t => head.appendChild(el('span', '', t)));
        grid.appendChild(head);
        groups.get(k).forEach(s => grid.appendChild(buildCard(s)));
        sec.appendChild(grid);
        list.appendChild(sec);
      });

      renderDateStrip(keys);
      setActiveChip(keys[0]);
      renderFilters();
      applyFilter();
      refreshStates();
      updateBar();
      observeDays();
      document.documentElement.style.setProperty('--toolbar-h', $('toolbar').offsetHeight + 'px');
    }

    const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

    function buildCard(s) {
      const b = el('button', 'slot');
      b.type = 'button';
      b.dataset.row = s.row;
      b.dataset.platform = platformOf(s);

      const text = el('span', 'slot-text');
      text.appendChild(el('span', 'slot-time', `${s.start} – ${s.end}`));
      const meta = el('span', 'slot-meta');
      meta.appendChild(el('span', 'tag p' + platformIndex[platformOf(s)], platformOf(s)));
      meta.appendChild(el('span', '', fmtHours(hoursOf(s))));
      text.appendChild(meta);

      const check = el('span', 'check');
      check.setAttribute('aria-hidden', 'true');
      check.innerHTML = CHECK_SVG;

      b.appendChild(text);
      b.appendChild(check);
      b.setAttribute('aria-label', `${platformOf(s)} ${s.start} ถึง ${s.end}`);
      b.addEventListener('click', () => toggle(s.row));
      cardByRow.set(s.row, b);
      return b;
    }

    function renderDateStrip(keys) {
      const strip = $('dateStrip');
      strip.innerHTML = '';
      keys.forEach(k => {
        const d = parseKey(k);
        const c = el('button', 'chip');
        c.type = 'button';
        c.id = 'chip-' + k;
        c.dataset.date = k;
        c.appendChild(el('span', 'chip-wd', relLabel(k) || fmtWeekShort.format(d)));
        c.appendChild(el('span', 'chip-day', String(d.getDate())));
        c.appendChild(el('span', 'chip-mon', fmtMonthShort.format(d)));
        c.appendChild(el('span', 'chip-count'));
        c.addEventListener('click', () => {
          const sec = $('day-' + k);
          if (sec) sec.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'start' });
          setActiveChip(k);
        });
        strip.appendChild(c);
      });
    }

    // ---------- ลากแถบวันที่ด้วยเมาส์ / เลื่อนด้วยลูกกลิ้ง ----------
    // (บนมือถือปัดด้วยนิ้วได้อยู่แล้ว ส่วนนี้เพิ่มให้คอมพิวเตอร์)
    function updateStripFade() {
      const strip = $('dateStrip');
      const max = strip.scrollWidth - strip.clientWidth;
      strip.classList.toggle('fade-l', strip.scrollLeft > 2);
      strip.classList.toggle('fade-r', strip.scrollLeft < max - 2);
    }

    function enableDragScroll(strip) {
      let down = false, dragging = false, startX = 0, startLeft = 0, pid = null;

      strip.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        down = true; dragging = false;
        startX = e.clientX; startLeft = strip.scrollLeft; pid = e.pointerId;
      });

      strip.addEventListener('pointermove', e => {
        if (!down || e.pointerId !== pid) return;
        const dx = e.clientX - startX;
        if (!dragging && Math.abs(dx) > 5) {
          dragging = true;
          strip.classList.add('is-dragging');
          try { strip.setPointerCapture(pid); } catch (_) {}
        }
        if (dragging) {
          strip.scrollLeft = startLeft - dx;
          e.preventDefault();
        }
      });

      function end() {
        if (!down) return;
        down = false;
        if (!dragging) return;
        strip.classList.remove('is-dragging');
        try { strip.releasePointerCapture(pid); } catch (_) {}
        // กันไม่ให้การปล่อยเมาส์หลังลาก ถูกนับเป็นการกดเลือกวัน
        const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };
        strip.addEventListener('click', swallow, { capture: true, once: true });
        setTimeout(() => strip.removeEventListener('click', swallow, { capture: true }), 0);
      }
      strip.addEventListener('pointerup', end);
      strip.addEventListener('pointercancel', end);
      strip.addEventListener('dragstart', e => e.preventDefault());

      // หมุนลูกกลิ้งเมาส์ขึ้น-ลง = เลื่อนวันที่ซ้าย-ขวา (สุดทางแล้วปล่อยให้หน้าเลื่อนตามปกติ)
      strip.addEventListener('wheel', e => {
        if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        const max = strip.scrollWidth - strip.clientWidth;
        if (max <= 0) return;
        if ((e.deltaY < 0 && strip.scrollLeft <= 0) || (e.deltaY > 0 && strip.scrollLeft >= max - 1)) return;
        strip.scrollLeft += e.deltaY;
        e.preventDefault();
      }, { passive: false });

      strip.addEventListener('scroll', updateStripFade, { passive: true });
      window.addEventListener('resize', updateStripFade);
    }
    enableDragScroll($('dateStrip'));

    function renderFilters() {
      const wrap = $('filters');
      wrap.innerHTML = '';
      const names = Object.keys(platformIndex);
      if (names.length < 2) { wrap.hidden = true; return; }
      wrap.hidden = false;
      ['all'].concat(names).forEach(n => {
        const b = el('button', 'filter' + (n === 'all' ? '' : ' is-multi p' + platformIndex[n]), n === 'all' ? 'ทั้งหมด' : n);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(n === 'all' ? activeFilters.size === 0 : activeFilters.has(n)));
        b.addEventListener('click', () => {
          if (n === 'all') {
            activeFilters.clear();
          } else {
            // เลือกได้หลายแพลตฟอร์มพร้อมกัน กดซ้ำเพื่อเอาออก
            if (activeFilters.has(n)) activeFilters.delete(n); else activeFilters.add(n);
            // เลือกครบทุกแพลตฟอร์ม = เหมือนกด "ทั้งหมด"
            if (activeFilters.size === names.length) activeFilters.clear();
          }
          renderFilters();
          applyFilter();
          document.documentElement.style.setProperty('--toolbar-h', $('toolbar').offsetHeight + 'px');
        });
        wrap.appendChild(b);
      });
    }

    function applyFilter() {
      let any = false;
      document.querySelectorAll('.day').forEach(sec => {
        let visible = 0;
        sec.querySelectorAll('.slot').forEach(card => {
          const show = activeFilters.size === 0 || activeFilters.has(card.dataset.platform);
          card.hidden = !show;
          if (show) visible++;
        });
        sec.hidden = visible === 0;
        sec.querySelector('.day-count').textContent = `ว่าง ${visible} slot`;
        const chip = $('chip-' + sec.dataset.date);
        if (chip) {
          chip.hidden = visible === 0;
          chip.querySelector('.chip-count').textContent = `${visible} slot`;
        }
        if (visible) any = true;
      });
      updateStripFade();
      $('filterEmpty').hidden = any || !slotByRow.size;
    }

    function setActiveChip(k) {
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('is-active', c.dataset.date === k));
      const chip = $('chip-' + k);
      const strip = $('dateStrip');
      if (chip) {
        strip.scrollTo({
          left: chip.offsetLeft - strip.clientWidth / 2 + chip.clientWidth / 2,
          behavior: reducedMotion ? 'auto' : 'smooth',
        });
      }
    }

    function observeDays() {
      if (dayObserver) dayObserver.disconnect();
      if (!('IntersectionObserver' in window)) return;
      const top = $('toolbar').offsetHeight + 8;
      dayObserver = new IntersectionObserver(entries => {
        const visible = entries.filter(e => e.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length) setActiveChip(visible[0].target.dataset.date);
      }, { rootMargin: `-${top}px 0px -65% 0px` });
      document.querySelectorAll('.day').forEach(sec => dayObserver.observe(sec));
    }

    // ---------- ธีมสว่าง / มืด (จำค่าไว้ในเครื่องผู้ใช้) ----------
    const THEME_KEY = 'glory_booking_theme';
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function effectiveTheme() {
      const t = document.documentElement.getAttribute('data-theme');
      return t === 'light' || t === 'dark' ? t : (darkQuery.matches ? 'dark' : 'light');
    }
    function syncThemeUi() {
      const dark = effectiveTheme() === 'dark';
      document.documentElement.classList.toggle('is-dark', dark);
      const btn = $('themeBtn');
      btn.setAttribute('aria-label', dark ? 'เปลี่ยนเป็นธีมสว่าง' : 'เปลี่ยนเป็นธีมมืด');
      btn.title = btn.getAttribute('aria-label');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#1A1016' : '#FFF7FA';
    }
    $('themeBtn').addEventListener('click', () => {
      const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      syncThemeUi();
    });
    darkQuery.addEventListener('change', syncThemeUi);
    syncThemeUi();

    // ---------- มุมมอง การ์ด / ตาราง (จำค่าไว้ในเครื่องผู้ใช้) ----------
    const VIEW_KEY = 'glory_booking_view';
    function setView(mode) {
      document.body.classList.toggle('view-table', mode === 'table');
      document.querySelectorAll('.view-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === mode)));
      try { localStorage.setItem(VIEW_KEY, mode); } catch (e) {}
    }
    document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    setView((() => { try { return localStorage.getItem(VIEW_KEY); } catch (e) { return null; } })() === 'table' ? 'table' : 'card');

    // ---------- เลือก slot ----------
    function blockReason(s) {
      if (isLocked) return 'ระบบปิดรับจองชั่วคราว';
      const chosen = Array.from(selected.values());
      if (chosen.some(x => s.startMs < x.endMs && s.endMs > x.startMs)) return 'เวลานี้ทับกับ slot ที่เลือกไว้แล้ว';
      if (chosen.length >= MAX_PER_REQUEST) return `เลือกได้ครั้งละไม่เกิน ${MAX_PER_REQUEST} slot`;
      const sameDay = chosen.filter(x => x.date === s.date);
      if (sameDay.length >= MAX_SLOTS_PER_DAY) return `เลือกได้สูงสุด ${MAX_SLOTS_PER_DAY} slot ต่อวัน`;
      const hrs = sameDay.reduce((a, x) => a + hoursOf(x), 0);
      if (hrs + hoursOf(s) > MAX_HOURS_PER_DAY) return `รวมแล้วเกิน ${MAX_HOURS_PER_DAY} ชม. ต่อวัน`;
      return '';
    }

    function toggle(row) {
      const s = slotByRow.get(row);
      if (!s) return;
      if (selected.has(row)) {
        selected.delete(row);
      } else {
        const reason = blockReason(s);
        if (reason) { showToast(reason, 'error'); return; }
        selected.set(row, s);
      }
      refreshStates();
      updateBar();
    }

    function refreshStates() {
      cardByRow.forEach((card, row) => {
        const isSel = selected.has(row);
        card.classList.toggle('is-selected', isSel);
        card.setAttribute('aria-pressed', String(isSel));
        card.classList.toggle('is-blocked', !isSel && !!blockReason(slotByRow.get(row)));
      });
      const daysWithSel = new Set(Array.from(selected.values()).map(s => s.date));
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('has-sel', daysWithSel.has(c.dataset.date)));
    }

    function sortedSelected() {
      return Array.from(selected.values()).sort((a, b) => a.startMs - b.startMs);
    }

    function updateBar() {
      const bar = $('bar');
      const n = selected.size;
      const show = n > 0 && !isLocked;
      bar.classList.toggle('is-open', show);
      bar.setAttribute('aria-hidden', String(!show));
      bar.inert = !show;
      document.body.classList.toggle('has-bar', show);
      if (!n) return;
      const hrs = sortedSelected().reduce((a, s) => a + hoursOf(s), 0);
      $('barCount').textContent = `เลือกแล้ว ${n} slot`;
      $('barHours').textContent = `รวม ${fmtHours(hrs)}`;
      $('barAction').textContent = currentUser ? `จอง ${n} slot` : 'เข้าสู่ระบบเพื่อจอง';
    }

    $('barClear').addEventListener('click', () => {
      selected.clear();
      refreshStates();
      updateBar();
    });

    $('barAction').addEventListener('click', () => {
      if (!currentUser) { goToLogin(); return; }
      openConfirm();
    });

    // ---------- ยืนยันการจอง ----------
    const dlg = $('dlg');

    function summaryItem(s, result) {
      const li = el('li');
      const left = el('div');
      if (s) {
        left.appendChild(el('div', 'sum-main', `${s.start} – ${s.end}`));
        left.appendChild(el('div', 'sum-sub', `${fmtDayShort.format(parseKey(s.date))}  |  ${platformOf(s)}`));
      } else {
        left.appendChild(el('div', 'sum-main', 'slot'));
      }
      li.appendChild(left);
      if (result) {
        li.appendChild(el('div', 'sum-status ' + (result.success ? 'ok' : 'err'),
          result.success ? '✓ จองแล้ว' : result.message));
      } else if (s) {
        li.appendChild(el('div', 'sum-status', fmtHours(hoursOf(s))));
      }
      return li;
    }

    function setDialogState(state) {
      dlg.dataset.state = state;
      $('dlgCancel').hidden = state === 'done';
      $('dlgConfirm').hidden = state === 'done';
      $('dlgDone').hidden = state !== 'done';
      $('dlgConfirm').disabled = state === 'busy';
      $('dlgCancel').disabled = state === 'busy';
      $('dlgConfirm').textContent = state === 'busy' ? 'กำลังจอง...' : 'ยืนยันการจอง';
    }

    function openConfirm() {
      if (!tokenIsFresh(idToken)) {
        signOut();
        showToast('การเข้าสู่ระบบหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'error');
        goToLogin();
        return;
      }
      const list = $('dlgList');
      list.innerHTML = '';
      sortedSelected().forEach(s => list.appendChild(summaryItem(s)));
      $('dlgTitle').textContent = `ยืนยันการจอง ${selected.size} slot`;
      $('dlgNote').textContent = `จองในนาม Mc ${currentUser.mcName} ระบบจะลงปฏิทินให้อัตโนมัติ`;
      setDialogState('confirm');
      dlg.showModal();
    }

    async function submitBooking() {
      setDialogState('busy');
      const rows = sortedSelected().map(s => s.row);
      try {
        const res = await callApi('book', { idToken: idToken, rows: rows });
        if (!res.ok) {
          if (res.authError) {
            dlg.close();
            signOut();
            goToLogin();
          } else {
            setDialogState('confirm');
          }
          showToast(res.message, 'error');
          return;
        }
        showResults(res.results || []);
      } catch (err) {
        // ไม่ลองจองซ้ำอัตโนมัติ เพราะคำขออาจถึงระบบแล้วแต่คำตอบหายระหว่างทาง
        showResults(null);
      }
    }

    function showResults(results) {
      const list = $('dlgList');
      list.innerHTML = '';
      if (!results) {
        $('dlgTitle').textContent = 'ไม่ได้รับคำตอบจากระบบ';
        $('dlgNote').textContent = 'การจองอาจสำเร็จแล้ว กด "เสร็จสิ้น" เพื่อโหลดรายการใหม่ ถ้า slot หายไปจากรายการแปลว่าจองสำเร็จ';
        sortedSelected().forEach(s => list.appendChild(summaryItem(s)));
      } else {
        const ok = results.filter(r => r.success).length;
        $('dlgTitle').textContent = ok === results.length
          ? `จองสำเร็จ ${ok} slot`
          : ok === 0 ? 'จองไม่สำเร็จ' : `จองสำเร็จ ${ok} จาก ${results.length} slot`;
        $('dlgNote').textContent = ok > 0
          ? 'ระบบลงปฏิทินให้เรียบร้อยแล้ว'
          : 'ดูเหตุผลด้านล่าง แล้วเลือก slot อื่น';
        results.forEach(r => list.appendChild(summaryItem(slotByRow.get(r.row), r)));
      }
      setDialogState('done');
      selected.clear();
      refreshStates();
      updateBar();
    }

    $('dlgCancel').addEventListener('click', () => dlg.close());
    $('dlgConfirm').addEventListener('click', submitBooking);
    $('dlgDone').addEventListener('click', () => dlg.close());
    dlg.addEventListener('cancel', e => { if (dlg.dataset.state === 'busy') e.preventDefault(); });
    dlg.addEventListener('close', () => { if (dlg.dataset.state === 'done') loadAll(); });

    // ---------- ปุ่มกลับขึ้นบนสุด: โผล่เมื่อเลื่อนลงเกิน 250px ----------
    const TO_TOP_AFTER = 250;
    const toTop = $('toTop');
    let toTopTicking = false;
    function syncToTop() {
      toTopTicking = false;
      const show = window.scrollY > TO_TOP_AFTER;
      toTop.classList.toggle('is-show', show);
      toTop.tabIndex = show ? 0 : -1;
    }
    window.addEventListener('scroll', () => {
      if (!toTopTicking) { toTopTicking = true; requestAnimationFrame(syncToTop); }
    }, { passive: true });
    toTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
    });
    syncToTop();

    // ---------- toast ----------
    function showToast(message, type) {
      const t = $('toast');
      t.textContent = message;
      t.className = 'toast is-show' + (type === 'error' ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast' + (type === 'error' ? ' error' : ''); }, 3500);
    }

    // ---------- เริ่มต้น ----------
    const savedToken = loadToken();
    if (tokenIsFresh(savedToken)) {
      signIn(savedToken, true); // รีเฟรชหน้าภายใน 1 ชม. ไม่ต้อง login ใหม่
    } else {
      clearToken();
      setAuthUi('out');
    }
    loadAll();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGsi()"></script>
</body>
</html>
